[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-link"
version = "2.0.0"
description = "Local-first coordination and collaboration for Claude Code and Codex CLI"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "click",
    "mcp>=2,<3",
]

[project.optional-dependencies]
test = ["pytest", "pytest-httpx"]

[project.scripts]
agentctl = "balancer.cli:main"

[tool.setuptools.packages.find]
include = ["balancer*", "mcp_server*"]

[tool.setuptools.package-data]
balancer = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
