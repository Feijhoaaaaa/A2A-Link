[build-system]
requires = ["setuptools>=77"]  # SPDX `license` string (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "a2a-link"
version = "2.2.0"
description = "Local-first balancer + MCP delegation server for Claude Code / Codex CLI"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "click",
    "mcp>=2,<3",
]

[project.optional-dependencies]
test = ["pytest", "pytest-httpx", "pytest-xdist"]

[project.scripts]
agentctl = "balancer.cli:main"
a2a-link = "balancer.cli:main"
a2a-link-runner = "mcp_server.test_runner:main"

[tool.setuptools.packages.find]
include = ["balancer*", "mcp_server*"]

[tool.setuptools.package-data]
balancer = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
